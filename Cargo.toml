[package]
name = "cargo-anywhere"
version = "0.1.0"
edition = "2021"
description = "Nix/devenv-aware remote Cargo runner with automatic client CPU optimization"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
