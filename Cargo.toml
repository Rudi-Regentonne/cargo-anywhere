[package]
name = "cargo-anywhere"
version = "0.1.0"
edition = "2021"
description = "Nix/devenv-aware remote Cargo runner with automatic client CPU optimization"
license = "MIT"
repository = "https://github.com/Rudi-Regentonne/cargo-anywhere"
homepage = "https://github.com/Rudi-Regentonne/cargo-anywhere"
readme = "README.md"
keywords = ["cargo", "remote", "ssh", "nix", "devenv"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
exclude = [
    ".devenv/",
    ".direnv/",
    ".envrc",
    ".github/",
    ".pre-commit-config.yaml",
    "devenv.*",
    "flake.*",
]

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
